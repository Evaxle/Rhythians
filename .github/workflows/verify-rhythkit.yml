name: Verify RhythKit integration

on:
  push:
    branches:
      - main
      - feat/rhythkit-recent-scores
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:rhythkit-map-file
